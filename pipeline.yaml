trigger:
  branches:
    include:
      - '*'

pr:
  branches:
    exclude:
      - '*'

pool:
  name: 'DEFRA-COMMON-UBUNTU-SSV5'

resources:
  repositories:
    - repository: ipaffs-infra
      type: github
      endpoint: DEFRA
      name: DEFRA/ipaffs-infra
      # TEMPORARY: test the feed templates before ipaffs-infra merges them; revert to refs/heads/main
      ref: refs/heads/imta-21519-ado-feed-publish

stages:
  - template: /pipelines/templates/java-library-template.yaml@ipaffs-infra
    parameters:
      sonarAnalysis: true
      sonarReferenceBranch: master
      mavenRegistry: feed
